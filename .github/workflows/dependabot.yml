name: Dependabot auto-label and lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Apply dependencies label
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['dependencies']
            })

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-duckdb

      - name: Override profiles.yml with DuckDB for CI
        run: |
          cat > profiles.yml << 'EOF'
          titanbay_is:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: /tmp/ci.duckdb
                threads: 4
          EOF

      - name: Validate project structure (no DB needed)
        run: dbt parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}

      - name: Lint SQL (dbt-templated)
        run: sqlfluff lint models/
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
