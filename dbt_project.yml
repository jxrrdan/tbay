name: 'titanbay_is'
version: '1.0.0'
config-version: 2

profile: 'titanbay_is'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Seeds
# The six raw extracts are loaded as seeds so the whole project is runnable
# from a clean clone with `dbt build`. In production these would instead be
# `sources` pointing at the Freshdesk and platform-warehouse landing tables.
# ---------------------------------------------------------------------------
seeds:
  titanbay_is:
    +schema: raw
    +quote_columns: false

models:
  titanbay_is:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
